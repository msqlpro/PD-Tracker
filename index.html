      {impStatus && <p className="text-center text-sm mt-2 font-medium">{impStatus}</p>}

// ── Spark — mini SVG sparkline ──
function Spark(p) {
  var data = (p.data || []).filter(function(v) { return v !== null && v !== undefined; });
  if (data.length < 2) return <div className="h-10 flex items-center justify-center text-xs text-gray-400">Not enough data yet</div>;
  var mn = Math.min.apply(null, data), mx = Math.max.apply(null, data);
  var range = mx - mn || 1;
  var W = 300, H = 40;
  var pts = data.map(function(v, i) {
    var x = (i / (data.length - 1)) * W;
    var y = H - ((v - mn) / range) * (H - 4) - 2;
    return x.toFixed(1) + "," + y.toFixed(1);
  }).join(" ");
  return (<svg viewBox={"0 0 " + W + " " + H} className="w-full" style={{ height: 40 }}>
    <polyline points={pts} fill="none" stroke={p.color || "#6366f1"} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
  </svg>);
}

// ── InsightsPage ──
function InsightsPage(p) {
  var DAYS = 30;
  var [aiInsights, sAiInsights] = useState(null);
  var [aiLoading, sAiLoading] = useState(false);
  var [aiQ, sAiQ] = useState("");
  var [aiQResult, sAiQResult] = useState(null);
  var [aiQLoading, sAiQLoading] = useState(false);

  var dailies = Array.from({ length: DAYS }, function(_, i) {
    var d = dAgo(i);
    var dayLogs = p.logs.filter(function(l) { return dateOf(l.takenAt) === d; });
    var daySym = p.sym.filter(function(s) { return dateOf(s.loggedAt) === d; });
    var daySlp = p.slp.find(function(s) { return s.date === d; });
    var dayEx = p.ex.filter(function(e) { return dateOf(e.loggedAt) === d; });
    var dayOo = p.oo.filter(function(o) { return dateOf(o.loggedAt) === d; });
    var dayMood = (p.mood || []).find(function(m) { return m.date === d; });
    var dayMeals = p.meals.filter(function(m) { return dateOf(m.loggedAt) === d; });
    var avgEff = dayLogs.length ? dayLogs.reduce(function(s, l) { return s + (l.effectiveness || 0); }, 0) / dayLogs.length : null;
    var avgSym = daySym.length ? daySym.reduce(function(s, sy) { return s + (sy.severity || 0); }, 0) / daySym.length : null;
    var exMins = dayEx.reduce(function(s, e) { return s + (e.duration || 0); }, 0);
    var totalProt = dayMeals.reduce(function(s, m) { return s + (m.protein || 0); }, 0);
    var onMins = null;
    if (dayOo.length) {
      var sorted = dayOo.slice().sort(function(a, b) { return (a.loggedAt||"").localeCompare(b.loggedAt||""); });
      var on = 0;
      for (var i = 0; i < sorted.length - 1; i++) {
        if (sorted[i].state === "on") on += (new Date(sorted[i+1].loggedAt) - new Date(sorted[i].loggedAt)) / 60000;
      }
      onMins = Math.round(on);
    }
    return { d: d, sym: avgSym, sleep: daySlp ? daySlp.quality : null, sleepHrs: daySlp ? daySlp.hours : null, exMins: exMins, medEff: avgEff && avgEff > 0 ? avgEff : null, mood: dayMood ? dayMood.level : null, protein: totalProt || null, onMins: onMins };
  }).reverse();

  var wByDay = {};
  (p.weight || []).forEach(function(w) { wByDay[w.date] = w.weight; });

  function pearson(pairs) {
    if (!pairs || pairs.length < 3) return null;
    var n = pairs.length, sx = 0, sy = 0, sxy = 0, sx2 = 0, sy2 = 0;
    pairs.forEach(function(p) { sx += p[0]; sy += p[1]; sxy += p[0]*p[1]; sx2 += p[0]*p[0]; sy2 += p[1]*p[1]; });
    var num = n*sxy - sx*sy;
    var den = Math.sqrt((n*sx2-sx*sx)*(n*sy2-sy*sy));
    return den === 0 ? null : parseFloat((num/den).toFixed(2));
  }

  var correlations = (function() {
    var results = [];
    var slpSymPairs = [];
    for (var i = 0; i < dailies.length - 1; i++) {
      if (dailies[i].sleep !== null && dailies[i+1].sym !== null) slpSymPairs.push([dailies[i].sleep, dailies[i+1].sym]);
    }
    var r1 = pearson(slpSymPairs);
    if (r1 !== null && Math.abs(r1) > 0.2) {
      var goodSlp = slpSymPairs.filter(function(p) { return p[0] >= 4; }).map(function(p) { return p[1]; });
      var badSlp = slpSymPairs.filter(function(p) { return p[0] <= 2; }).map(function(p) { return p[1]; });
      if (goodSlp.length >= 2 && badSlp.length >= 2) {
        var gA = (goodSlp.reduce(function(s,v){return s+v;},0)/goodSlp.length).toFixed(1);
        var bA = (badSlp.reduce(function(s,v){return s+v;},0)/badSlp.length).toFixed(1);
        results.push({ icon:"😴", color:"indigo", title:"Sleep → Next Day Symptoms", r: r1, detail: "After good sleep (4-5★): avg severity "+gA+"/5. After poor sleep (1-2★): "+bA+"/5.", strength: Math.abs(r1)>0.5?"strong":Math.abs(r1)>0.3?"moderate":"weak" });
      }
    }
    var exSymPairs = dailies.filter(function(d){return d.exMins>0&&d.sym!==null;}).map(function(d){return [d.exMins,d.sym];});
    var noExSym = dailies.filter(function(d){return d.exMins===0&&d.sym!==null;}).map(function(d){return d.sym;});
    if (exSymPairs.length >= 3 && noExSym.length >= 3) {
      var exAvg = (exSymPairs.reduce(function(s,p){return s+p[1];},0)/exSymPairs.length).toFixed(1);
      var noExAvg = (noExSym.reduce(function(s,v){return s+v;},0)/noExSym.length).toFixed(1);
      results.push({ icon:"🏃", color:"orange", title:"Exercise → Symptom Severity", r: pearson(exSymPairs)||0, detail: "Exercise days: "+exAvg+"/5 avg severity. Rest days: "+noExAvg+"/5.", strength: parseFloat(noExAvg)-parseFloat(exAvg)>0.5?"strong":parseFloat(noExAvg)-parseFloat(exAvg)>0.2?"moderate":"weak" });
    }
    var protEffPairs = dailies.filter(function(d){return d.protein!==null&&d.medEff!==null;}).map(function(d){return [d.protein,d.medEff];});
    var r4 = pearson(protEffPairs);
    if (r4 !== null && Math.abs(r4) > 0.2) {
      var hiProt = protEffPairs.filter(function(p){return p[0]>80;}).map(function(p){return p[1];});
      var loProt = protEffPairs.filter(function(p){return p[0]<=80;}).map(function(p){return p[1];});
      if (hiProt.length >= 2 && loProt.length >= 2) {
        var hpA = (hiProt.reduce(function(s,v){return s+v;},0)/hiProt.length).toFixed(1);
        var lpA = (loProt.reduce(function(s,v){return s+v;},0)/loProt.length).toFixed(1);
        results.push({ icon:"🥩", color:"red", title:"Protein → Med Effectiveness", r: r4, detail: "High protein days (80g+): "+hpA+"/5. Lower protein days: "+lpA+"/5.", strength: Math.abs(r4)>0.5?"strong":Math.abs(r4)>0.3?"moderate":"weak" });
      }
    }
    var exOnPairs = dailies.filter(function(d){return d.exMins>0&&d.onMins!==null;}).map(function(d){return [d.exMins,d.onMins];});
    var noExOn = dailies.filter(function(d){return d.exMins===0&&d.onMins!==null;}).map(function(d){return d.onMins;});
    if (exOnPairs.length >= 3 && noExOn.length >= 2) {
      var exOnAvg = Math.round(exOnPairs.reduce(function(s,p){return s+p[1];},0)/exOnPairs.length);
      var noExOnAvg = Math.round(noExOn.reduce(function(s,v){return s+v;},0)/noExOn.length);
      results.push({ icon:"🟢", color:"green", title:"Exercise → ON Time", r: null, detail: "Exercise days: avg "+exOnAvg+"min ON. Rest days: avg "+noExOnAvg+"min ON.", strength: exOnAvg-noExOnAvg>30?"strong":exOnAvg-noExOnAvg>10?"moderate":"weak" });
    }
    return results;
  })();

  var buildSummary = function(extraQ) {
    var s = "PARKINSON'S TRACKING DATA — LAST 30 DAYS:\n";
    dailies.forEach(function(d) {
      if (d.sym!==null||d.sleep!==null||d.exMins>0||d.mood!==null||d.medEff!==null) {
        s += d.d + ": ";
        if (d.sym!==null) s+="sym="+d.sym.toFixed(1)+"/5 ";
        if (d.sleep!==null) s+="sleep="+d.sleep+"/5("+d.sleepHrs+"h) ";
        if (d.exMins>0) s+="ex="+d.exMins+"min ";
        if (d.mood!==null) s+="mood="+d.mood+"/5 ";
        if (d.medEff!==null) s+="medEff="+d.medEff.toFixed(1)+"/5 ";
        if (d.protein!==null) s+="protein="+d.protein+"g ";

        s+="\n";
      }
    });
    var recentMeals = p.meals.filter(function(m) { return m.loggedAt && m.loggedAt >= dAgo(30) && m.foodBreakdown && m.foodBreakdown.length; });
    if (recentMeals.length) {

      recentMeals.forEach(function(m) {
        s += "- " + m.loggedAt.slice(0,10) + " " + m.description + ": ";
        s += m.foodBreakdown.map(function(f) { return f.food + "(P:" + f.protein + "g,C:" + f.carbs + "g,Cal:" + f.calories + "kcal)"; }).join(", ");

      });
    }
    if (correlations.length) { s += "\nCOMPUTED CORRELATIONS:\n"; correlations.forEach(function(c) { s += c.title+": "+c.detail+"\n"; }); }

  };

  var runAiAnalysis = async function() {
    sAiLoading(true); sAiInsights(null);
    try {
      var res = await fetch("https://api.anthropic.com/v1/messages", { method:"POST", headers:{"Content-Type":"application/json","x-api-key":ANTHROPIC_API_KEY,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"}, body: JSON.stringify({ model:"claude-sonnet-4-5-20250929", max_tokens:1500, messages:[{role:"user",content:buildSummary()+"\n\nYou are a Parkinson's disease data analyst. Analyse the patterns above and give clear, specific insights about how this person's lifestyle factors (sleep, exercise, protein, ON/OFF time) interact with their symptoms and medication effectiveness. Be encouraging, specific, and use emoji. Use markdown formatting."}] }) });

      var data = await res.json();

  var colorMap = { indigo:"border-indigo-200 bg-indigo-50", orange:"border-orange-200 bg-orange-50", red:"border-red-200 bg-red-50", green:"border-green-200 bg-green-50" };
  var hasSym = dailies.filter(function(d){return d.sym!==null;});
  var hasSleep = dailies.filter(function(d){return d.sleep!==null;});
  var hasMood = dailies.filter(function(d){return d.mood!==null;});

  return (<div className="p-4 pb-28">
    <h2 className="text-xl font-bold mb-4">📈 Insights</h2>

function AppGrid(p) {
  var buildButtons = function() {
    var medBtn = { id: "med_picker", emoji: "💊", label: "Medication", grad: "from-indigo-600 to-blue-500", isMedPicker: true };
    var all = [medBtn].concat(DEF_APP_BUTTONS);
    try {
      var saved = JSON.parse(localStorage.getItem(APP_BTN_ORDER_KEY) || "null");
      if (saved && Array.isArray(saved)) {
        var ordered = [];
        saved.forEach(function(id) { var b = all.find(function(x) { return x.id === id; }); if (b) ordered.push(b); });
        all.forEach(function(b) { if (saved.indexOf(b.id) < 0) ordered.push(b); });
        return ordered;
      }
    } catch(e) {}
    return all;
  };

  var [buttons, setButtons] = useState(buildButtons);
  var [wiggle, setWiggle] = useState(false);
  var [dragIdx, setDragIdx] = useState(null);
  var gridRef = React.useRef(null);
  var stateRef = React.useRef({ wiggle: false, buttons: [], dragIdx: null, longTimer: null, startX: 0, startY: 0, tapped: false, lO: null, onQuickOo: null, onQuickSym: null, setM: null });

  useEffect(function() { stateRef.current.wiggle = wiggle; }, [wiggle]);
  useEffect(function() { stateRef.current.buttons = buttons; }, [buttons]);
  useEffect(function() { stateRef.current.dragIdx = dragIdx; }, [dragIdx]);
  stateRef.current.lO = p.lO;
  stateRef.current.onQuickOo = p.onQuickOo;
  stateRef.current.onQuickSym = p.onQuickSym;
  stateRef.current.setM = p.setM;

  var saveOrder = function(btns) {
    try { localStorage.setItem(APP_BTN_ORDER_KEY, JSON.stringify(btns.map(function(b) { return b.id; }))); } catch(e) {}
  };

  useEffect(function() {
    setButtons(function(prev) {
      var medBtn = { id: "med_picker", emoji: "💊", label: "Medication", grad: "from-indigo-600 to-blue-500", isMedPicker: true };
      var all = [medBtn].concat(DEF_APP_BUTTONS);
      var updated = prev.filter(function(b) { return all.find(function(x) { return x.id === b.id; }); });
      updated = updated.map(function(b) { var fresh = all.find(function(x) { return x.id === b.id; }); return fresh || b; });
      all.forEach(function(b) { if (!updated.find(function(x) { return x.id === b.id; })) updated.unshift(b); });
      return updated;
    });
  }, [p.meds]);

  var exitWiggle = function() {
    setWiggle(false);
    setDragIdx(null);
    stateRef.current.wiggle = false;
    saveOrder(stateRef.current.buttons);
  };

  useEffect(function() {
    if (wiggle) {
      document.body.style.overflow = "hidden";
      document.body.style.position = "fixed";
      document.body.style.width = "100%";
    } else {
      document.body.style.overflow = "";
      document.body.style.position = "";
      document.body.style.width = "";
    }
    return function() {
      document.body.style.overflow = "";
      document.body.style.position = "";
      document.body.style.width = "";
    };
  }, [wiggle]);

  useEffect(function() {
    var grid = gridRef.current;
    if (!grid) return;

    var handleTouchStart = function(e) {
      var s = stateRef.current;
      var touch = e.touches[0];
      s.startX = touch.clientX;
      s.startY = touch.clientY;
      s.tapped = true;
      var cell = touch.target.closest ? touch.target.closest("[data-bidx]") : null;
      var idx = cell ? parseInt(cell.getAttribute("data-bidx")) : null;
      if (idx === null || isNaN(idx)) return;
      if (s.wiggle) { s.dragIdx = idx; setDragIdx(idx); return; }
      s.longTimer = setTimeout(function() { s.wiggle = true; s.dragIdx = idx; setWiggle(true); setDragIdx(idx); }, 500);
    };

    var handleTouchMove = function(e) {
      var s = stateRef.current;
      var touch = e.touches[0];
      var dx = Math.abs(touch.clientX - s.startX);
      var dy = Math.abs(touch.clientY - s.startY);
      if (!s.wiggle) { if (dx > 8 || dy > 8) { clearTimeout(s.longTimer); s.tapped = false; } return; }
      if (s.dragIdx === null) return;
      var el = document.elementFromPoint(touch.clientX, touch.clientY);
      if (!el) return;
      var cell = el.closest ? el.closest("[data-bidx]") : null;
      if (!cell) return;
      var overIdx = parseInt(cell.getAttribute("data-bidx"));
      if (isNaN(overIdx) || overIdx === s.dragIdx) return;
      var arr = s.buttons.slice();
      var item = arr.splice(s.dragIdx, 1)[0];
      arr.splice(overIdx, 0, item);
      s.dragIdx = overIdx;
      s.buttons = arr;
      setButtons(arr.slice());
      setDragIdx(overIdx);
    };

    var handleTouchEnd = function(e) {
      var s = stateRef.current;
      clearTimeout(s.longTimer);
      if (s.wiggle) { setDragIdx(null); s.dragIdx = null; saveOrder(s.buttons); return; }
      if (s.tapped) {
        var touch = e.changedTouches[0];
        var el = document.elementFromPoint(touch.clientX, touch.clientY);
        var cell = el && el.closest ? el.closest("[data-bidx]") : null;
        if (cell) {
          var idx = parseInt(cell.getAttribute("data-bidx"));
          if (!isNaN(idx) && s.buttons[idx]) {
            var btn = s.buttons[idx];
            if (btn.isMedPicker) s.setM({ type: "medPicker" });
            else if (btn.isPie) {
              var lO2 = s.lO; var newState = (!lO2 || lO2.state === "off") ? "on" : "off";
              var stamp = new Date().toISOString();
              if (s.onQuickOo) s.onQuickOo({ id: Date.now().toString()+"_oo", state: newState, loggedAt: stamp });
            }
            else if (btn.isQuickSym) { if (s.onQuickSym) s.onQuickSym(); }
            else s.setM({ type: btn.id });
          }
        }
      }
      s.tapped = false;
    };

    grid.addEventListener("touchstart", handleTouchStart, { passive: true });
    grid.addEventListener("touchmove", handleTouchMove, { passive: true });
    grid.addEventListener("touchend", handleTouchEnd, { passive: true });

    return function() {
      grid.removeEventListener("touchstart", handleTouchStart);
      grid.removeEventListener("touchmove", handleTouchMove);
      grid.removeEventListener("touchend", handleTouchEnd);
    };
  }, []);

  return (<div className="mb-5">
    {wiggle && (
      <div className="flex justify-between items-center mb-3 px-1">
        <span className="text-xs text-gray-400 font-medium">Hold & drag to rearrange</span>
        <button onClick={exitWiggle} className="bg-gray-800 text-white text-xs font-bold px-4 py-1.5 rounded-full shadow">Done</button>
      </div>
    )}
    <div ref={gridRef} className="grid grid-cols-4 gap-x-3 gap-y-4" style={{ touchAction: wiggle ? "none" : "auto" }}>
      {buttons.map(function(btn, idx) {
        var isDragging = dragIdx === idx;
        return (
          <div key={btn.id} data-bidx={idx} className="flex flex-col items-center" style={{ touchAction: wiggle ? "none" : "auto" }} onClick={function() {
            if (wiggle) return;
            if (btn.isMedPicker) p.setM({ type: "medPicker" });
            else if (btn.isPie) {
              var lO2 = stateRef.current.lO; var newState = (!lO2 || lO2.state === "off") ? "on" : "off";
              if (stateRef.current.onQuickOo) stateRef.current.onQuickOo({ id: Date.now().toString()+"_oo", state: newState, loggedAt: new Date().toISOString() });
            }
            else if (btn.isQuickSym) { if (stateRef.current.onQuickSym) stateRef.current.onQuickSym(); }
            else p.setM({ type: btn.id });
          }}>
            {btn.isPie ? (function() {
              var oo = p.oo || []; var lO = p.lO;
              var dayStart = new Date(new Date().toISOString().slice(0,10)+"T00:00:00").getTime();
              var dayMs = 86400000;
              var nowDeg = Math.min(360, ((Date.now() - dayStart) / dayMs) * 360);
              var sorted = oo.slice().sort(function(a,b){ return (a.loggedAt||"").localeCompare(b.loggedAt||""); });
              var wedges = [];
              for (var wi = 0; wi < sorted.length; wi++) {
                var seg0 = Math.min(360, Math.max(0, ((new Date(sorted[wi].loggedAt).getTime()-dayStart)/dayMs)*360));
                var seg1 = wi < sorted.length-1 ? Math.min(360,Math.max(0,((new Date(sorted[wi+1].loggedAt).getTime()-dayStart)/dayMs)*360)) : nowDeg;
                if (seg1 > seg0) wedges.push({state:sorted[wi].state,s:seg0,e:seg1});
              }
              var cx=32,cy=32,r=30;
              var arc = function(s,e) {
                var toR=Math.PI/180, a=(s-90)*toR, b=(e-90)*toR;
                var x1=cx+r*Math.cos(a),y1=cy+r*Math.sin(a),x2=cx+r*Math.cos(b),y2=cy+r*Math.sin(b);
                if(e-s>=359.9) return "M "+cx+" "+(cy-r)+" A "+r+" "+r+" 0 1 1 "+(cx-0.001)+" "+(cy-r)+" Z";
                return "M "+cx+" "+cy+" L "+x1.toFixed(2)+" "+y1.toFixed(2)+" A "+r+" "+r+" 0 "+(e-s>180?1:0)+" 1 "+x2.toFixed(2)+" "+y2.toFixed(2)+" Z";
              };
              var isOn=lO&&lO.state==="on", isOff=lO&&lO.state==="off";
              var fill=isOn?"#16a34a":isOff?"#dc2626":"#9ca3af";
              var label=isOn?"ON":isOff?"OFF":"?";

                style={{opacity:isDragging?0.45:1,animationDelay:(idx%4*0.05)+"s",transform:isDragging?"scale(1.12)":"",transition:"opacity 0.1s, transform 0.1s",background:"#f3f4f6"}}>
                <svg width="64" height="64" viewBox="0 0 64 64">
                  <circle cx={cx} cy={cy} r={r} fill="#e5e7eb" />
                  {wedges.map(function(w,wi){ return <path key={wi} d={arc(w.s,w.e)} fill={w.state==="on"?"#22c55e":"#ef4444"} />; })}
                  <circle cx={cx} cy={cy} r="16" fill="white" />
                  <text x={cx} y={cy} textAnchor="middle" dominantBaseline="central" fill={fill} fontSize="10" fontWeight="bold" fontFamily="system-ui">{label}</text>
                </svg>
              </div>);

            <div className={"w-16 h-16 rounded-full bg-gradient-to-br " + btn.grad + " flex items-center justify-center shadow-lg " + (wiggle ? "wiggling" : "")}

              <span style={{ fontSize: "1.75rem", lineHeight: 1 }}>{btn.emoji}</span>
            </div>)}
            <span className="text-[10px] text-gray-600 mt-1.5 font-medium text-center leading-tight" style={{ maxWidth: "4rem" }}>{btn.label}</span>
          </div>
        );
      })}
    </div>
  </div>);
}

async function parseVoiceLog(transcript, medNames) {
  try {
    var medsStr = medNames.length ? medNames.join(", ") : "Sinemet";
    var symsStr = SYMS.map(function(s) { return s.id + " (" + s.l + ")"; }).join(", ");
    var prompt = "You are a Parkinson disease logging assistant. Parse this voice transcript into a structured log entry and return ONLY valid JSON (no markdown, no backticks).\n\nTranscript: \"" + transcript + "\"\n\nKnown medications: " + medsStr + "\nSymptom IDs: " + symsStr + "\n\nReturn one of these formats:\nMedication: {\"type\":\"med\",\"medName\":\"name\",\"dose\":\"amount or empty\"}\nSymptom: {\"type\":\"sym\",\"symptomId\":\"id\",\"severity\":3,\"notes\":\"\"}\nMeal: {\"type\":\"meal\",\"description\":\"what was eaten\"}\nMood: {\"type\":\"mood\",\"level\":3}\nON/OFF: {\"type\":\"onoff\",\"state\":\"on or off\"}\nUnknown: {\"type\":\"unknown\",\"message\":\"explanation\"}\n\nRules: match meds loosely, shaking=tremor stiff=stiffness slow=slowness frozen=freezing dizzy=balance tired=fatigue ache=pain foggy=brain_fog worried=anxiety jerky=dyskinesia, mild/slight=1-2 moderate=3 bad/severe=4-5, default severity 3";
    var response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-api-key": ANTHROPIC_API_KEY, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
      body: JSON.stringify({ model: "claude-sonnet-4-5-20250929", max_tokens: 300, messages: [{ role: "user", content: prompt }] })
    });
    var data = await response.json();
    var text = (data.content || []).map(function(b) { return b.text || ""; }).join("");
    return JSON.parse(text.replace(/```json/g, "").replace(/```/g, "").trim());
  } catch(e) { return { type: "unknown", message: "Parse error" }; }
}

function VoiceLogger(p) {
  var [vState, setVState] = React.useState("idle");
  var [transcript, setTranscript] = React.useState("");
  var [parsed, setParsed] = React.useState(null);
  var [errMsg, setErrMsg] = React.useState("");
  var recRef = React.useRef(null);

  var SEV_LABELS = ["","Mild","Low","Moderate","High","Severe"];
  var ICONS = { med: "💊", sym: "🫨", meal: "🍽️", mood: "😊", onoff: "🔄" };

  var startListening = function() {
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { setErrMsg("Speech recognition not supported"); setVState("error"); return; }
    if (!ANTHROPIC_API_KEY) { setErrMsg("No API key — add one in Settings"); setVState("error"); return; }
    var rec = new SR();
    rec.lang = "en-GB"; rec.interimResults = false; rec.maxAlternatives = 1;
    recRef.current = rec;
    rec.onresult = async function(e) {
      var t = e.results[0][0].transcript;
      setTranscript(t); setVState("parsing");
      var result = await parseVoiceLog(t, (p.meds || []).map(function(m) { return m.name; }));
      setParsed(result);
      if (result.type === "unknown") { setErrMsg(result.message || "Could not understand"); setVState("error"); }
      else { setVState("confirm"); }
    };
    rec.onerror = function(e) { setErrMsg("Mic error: " + e.error); setVState("error"); };
    setVState("listening"); rec.start();
  };

  var stopListening = function() {
    if (recRef.current) { try { recRef.current.stop(); } catch(e2) {} }
    setVState("idle");
  };

  var doConfirm = function() {
    if (!parsed) return;
    var stamp = new Date().toISOString();
    if (parsed.type === "med") {
      var med = (p.meds || []).find(function(m) { return m.name.toLowerCase() === (parsed.medName || "").toLowerCase(); }) || { id: "v_med", name: parsed.medName };
      p.onLog({ _type: "med", item: { id: Date.now().toString()+"_v", medId: med.id, medName: med.name, dose: parsed.dose || med.dose || "", takenAt: stamp, effectiveness: 0 } });
    } else if (parsed.type === "sym") {
      p.onLog({ _type: "sym", item: { id: Date.now().toString()+"_v", symptomId: parsed.symptomId, severity: parsed.severity || 3, notes: parsed.notes || "", loggedAt: stamp } });
    } else if (parsed.type === "meal") {
      p.onLog({ _type: "meal", item: { id: Date.now().toString()+"_v", description: parsed.description, loggedAt: stamp, protein: 0, carbs: 0, fibre: 0, calories: 0, sugar: 0, foodBreakdown: [] } });
    } else if (parsed.type === "mood") {
      p.onLog({ _type: "mood", item: { id: Date.now().toString()+"_v", level: parsed.level || 3, note: "", date: stamp.slice(0,10) } });
    } else if (parsed.type === "onoff") {
      p.onLog({ _type: "onoff", item: { id: Date.now().toString()+"_v", state: parsed.state, loggedAt: stamp } });
    }
    setVState("idle"); setTranscript(""); setParsed(null);
  };

  var doReset = function() { setVState("idle"); setTranscript(""); setParsed(null); setErrMsg(""); };

  var symObj = parsed && parsed.type === "sym" ? (SYMS.find(function(s) { return s.id === parsed.symptomId; }) || {}) : {};
  var confirmText = "";
  if (parsed) {
    if (parsed.type === "med") confirmText = "Log " + parsed.medName + (parsed.dose ? " · " + parsed.dose : "");
    else if (parsed.type === "sym") confirmText = "Log " + (symObj.e||"") + " " + (symObj.l||parsed.symptomId) + " · sev " + (parsed.severity||3) + "/5";
    else if (parsed.type === "meal") confirmText = "Log meal: " + parsed.description;
    else if (parsed.type === "mood") confirmText = "Log mood: " + (["","😫","😕","😐","😊","😁"][parsed.level||3]);
    else if (parsed.type === "onoff") confirmText = "Log state: " + (parsed.state||"").toUpperCase();
  }

  var btnBg = vState === "listening" ? "#dc2626" : vState === "parsing" ? "#d97706" : "#4f46e5";
  var btnIcon = vState === "parsing" ? "⏳" : vState === "listening" ? "⏹" : "🎤";

  return (
    <div>
      <button onClick={vState === "listening" ? stopListening : startListening}
        style={{position:"fixed",bottom:"88px",right:"16px",width:"58px",height:"58px",borderRadius:"50%",border:"none",cursor:"pointer",zIndex:50,display:"flex",alignItems:"center",justifyContent:"center",boxShadow:"0 4px 16px rgba(0,0,0,0.2)",background:btnBg}}>
        <span style={{fontSize:"24px"}}>{btnIcon}</span>
      </button>
      {(vState === "confirm" || vState === "error" || vState === "parsing") && (
        <div style={{position:"fixed",bottom:"160px",right:"16px",left:"16px",zIndex:55,background:"#fff",borderRadius:"16px",padding:"16px",boxShadow:"0 4px 24px rgba(0,0,0,0.18)",border:"1.5px solid #e5e7eb"}}>
          {transcript ? <div style={{fontSize:"12px",color:"#9ca3af",marginBottom:"8px",fontStyle:"italic"}}>"{transcript}"</div> : null}
          {vState === "parsing" && <div style={{fontSize:"14px",color:"#d97706",fontWeight:500}}>⏳ Understanding...</div>}
          {vState === "confirm" && parsed && (
            <div>
              <div style={{fontSize:"14px",fontWeight:600,color:"#1f2937",marginBottom:"12px"}}>{ICONS[parsed.type]||"📝"} {confirmText}</div>
              <div style={{display:"flex",gap:"8px"}}>
                <button onClick={doReset} style={{flex:1,padding:"12px",borderRadius:"10px",border:"1.5px solid #e5e7eb",background:"#f9fafb",fontWeight:600,fontSize:"14px",cursor:"pointer",color:"#6b7280"}}>Cancel</button>
                <button onClick={doConfirm} style={{flex:2,padding:"12px",borderRadius:"10px",border:"none",background:"#4f46e5",color:"#fff",fontWeight:700,fontSize:"14px",cursor:"pointer"}}>✓ Log it</button>
              </div>
            </div>
          )}
          {vState === "error" && (
            <div>
              <div style={{fontSize:"14px",color:"#dc2626",marginBottom:"10px"}}>⚠ {errMsg}</div>
              <button onClick={doReset} style={{width:"100%",padding:"10px",borderRadius:"10px",border:"none",background:"#fee2e2",color:"#dc2626",fontWeight:600,cursor:"pointer"}}>Try again</button>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

    {modal && modal.type === "dose" && <DoseMod med={modal.med} companionDrink={companionDrinks[modal.med.id] || null} meals={meals} onSave={handleDoseSave} onClose={close} />}
    {modal && modal.type === "groupDose" && <GroupDoseMod med={modal.med} companionDrink={companionDrinks[modal.med.id] || null} onSaveGroup={handleGroupDoseSave} onClose={close} />}
    {modal && modal.type === "eDose" && <DoseMod med={{ id: modal.log.medId, name: modal.log.medName, dose: modal.log.dose }} existing={modal.log} meals={meals} onSave={function(l) { uLog(l); close(); }} onDelete={handleDoseDelete} onClose={close} />}
    {modal && modal.type === "meal" && <MealMod onSave={hMs} onClose={close} prev={meals} />}
    {modal && modal.type === "eMeal" && <MealMod onSave={hMs} onClose={close} edit={modal.meal} prev={meals} />}
    {modal && modal.type === "ex" && <ExMod cexList={cexList} onSaveCex={function(v) { setCexList(v); sv(K.cex, v); }} onSave={function(e) { aEx(e); close(); }} onClose={close} />}
    {modal && modal.type === "eEx" && <ExMod existing={modal.data} cexList={cexList} onSaveCex={function(v) { setCexList(v); sv(K.cex, v); }} onSave={function(e) { uEx(e); close(); }} onDelete={function(id) { dEx(id); close(); }} onClose={close} />}
    {modal && modal.type === "slp" && <SlpMod onSave={function(s) { aSlp(s); close(); }} onClose={close} />}
    {modal && modal.type === "morningCheckin" && <MorningCheckinMod
      onSaveSleep={function(s) { aSlp(s); }}
      onSaveMood={function(m) { aMood(m); }}
      onSaveOo={function(o) { aOo(o); }}
      onSaveBowel={function(b) { aBowel(b); }}
      onSaveSym={function(s) { aSym(s); }}
      onClose={close} />}
    {modal && modal.type === "eSlp" && <SlpMod existing={modal.data} onSave={function(s) { uSlp(s); close(); }} onDelete={function(id) { dSlp(id); close(); }} onClose={close} />}
    {modal && modal.type === "symstate" && <SymStateMod onSaveSym={function(s) { aSym(s); }} onSaveOo={function(o) { aOo(o); }} onClose={close} />}
    {modal && modal.type === "eSym" && <SymStateMod existingSym={modal.data} onSaveSym={function(s) { uSym(s); }} onDeleteSym={function(id) { dSym(id); close(); }} onSaveOo={function() {}} onDeleteOo={function() {}} onClose={close} />}
    {modal && modal.type === "eOo" && <SymStateMod existingOo={modal.data} onSaveOo={function(o) { uOo(o); }} onDeleteOo={function(id) { dOo(id); close(); }} onSaveSym={function() {}} onDeleteSym={function() {}} onClose={close} />}
    {modal && modal.type === "eFast" && <FastMod existing={modal.data} onSave={function(f) { uFast(f); close(); }} onDelete={function(id) { dFast(id); close(); }} onClose={close} />}
    {modal && modal.type === "drink" && <DrinkMod onSave={function(d) { aDrink(d); close(); }} onClose={close} />}
    {modal && modal.type === "eDrink" && <DrinkMod existing={modal.data} onSave={function(d) { uDrink(d); close(); }} onDelete={function(id) { dDrink(id); close(); }} onClose={close} />}
    {modal && modal.type === "weight" && <WeightMod history={weight} onSave={function(w) { aWeight(w); close(); }} onClose={close} />}
    {modal && modal.type === "eWeight" && <WeightMod existing={modal.data} history={weight} onSave={function(w) { uWeight(w); close(); }} onDelete={function(id) { dWeight(id); close(); }} onClose={close} />}
    {modal && modal.type === "mood" && <MoodMod onSave={function(m) { aMood(m); close(); }} onClose={close} />}
    {modal && modal.type === "eMood" && <MoodMod existing={modal.data} onSave={function(m) { uMood(m); close(); }} onDelete={function(id) { dMood(id); close(); }} onClose={close} />}
    {modal && modal.type === "bowel" && <BowelMod onSave={function(b) { aBowel(b); close(); }} onClose={close} />}
    {modal && modal.type === "eBowel" && <BowelMod existing={modal.data} onSave={function(b) { uBowel(b); close(); }} onDelete={function(id) { dBowel(id); close(); }} onClose={close} />}
    {modal && modal.type === "activity" && <ActivityMod cactList={cactList} onSaveCact={function(v) { setCactList(v); sv(K.cact, v); }} onSave={function(a) { aAct(a); close(); }} onClose={close} />}
    {modal && modal.type === "eActivity" && <ActivityMod existing={modal.data} cactList={cactList} onSaveCact={function(v) { setCactList(v); sv(K.cact, v); }} onSave={function(a) { uAct(a); close(); }} onDelete={function(id) { dAct(id); close(); }} onClose={close} />}
  </div>);
}

function AuthScreen() {
  var [mode, setMode] = useState("login");
  var [email, setEmail] = useState("");
  var [password, setPassword] = useState("");
  var [name, setName] = useState("");
  var [loading, setLoading] = useState(false);
  var [error, setError] = useState("");
  var [success, setSuccess] = useState("");
  var handleSubmit = async function() {
    setLoading(true); setError(""); setSuccess("");
    try {
      if (mode === "login") { var { error: err } = await sb.auth.signInWithPassword({ email: email, password: password }); if (err) setError(err.message); }
      else if (mode === "signup") { if (password.length < 6) { setError("Password must be at least 6 characters"); setLoading(false); return; } var { error: err } = await sb.auth.signUp({ email: email, password: password, options: { data: { display_name: name } } }); if (err) setError(err.message); else setSuccess("Check your email for a confirmation link!"); }
      else if (mode === "reset") { var { error: err } = await sb.auth.resetPasswordForEmail(email, { redirectTo: "https://msqlpro.github.io/PD-Tracker/" }); if (err) setError(err.message); else setSuccess("Password reset email sent!"); }
    } catch (e) { setError(e.message); }
    setLoading(false);
  };
  return (<div className="max-w-md mx-auto min-h-screen bg-gray-50 flex flex-col">
    <div className="bg-gradient-to-r from-slate-900 to-indigo-900 text-white px-6 pt-12 pb-8 text-center"><div className="text-4xl mb-2">💊</div><h1 className="text-2xl font-bold tracking-tight">PD Tracker</h1><p className="text-indigo-300 text-sm mt-1">Parkinson's Disease Daily Tracker</p></div>
    <div className="p-6 flex-1"><div className="bg-white rounded-2xl p-6 shadow-sm">
      <div className="flex gap-2 mb-6"><button onClick={function() { setMode("login"); setError(""); setSuccess(""); }} className={"flex-1 py-2.5 rounded-xl text-sm font-bold " + (mode === "login" ? "bg-indigo-600 text-white" : "bg-gray-100 text-gray-500")}>Log In</button><button onClick={function() { setMode("signup"); setError(""); setSuccess(""); }} className={"flex-1 py-2.5 rounded-xl text-sm font-bold " + (mode === "signup" ? "bg-indigo-600 text-white" : "bg-gray-100 text-gray-500")}>Sign Up</button></div>
      {mode === "signup" && <label className="block mb-3"><span className="text-sm font-medium text-gray-700">Your Name</span><input type="text" value={name} onChange={function(e) { setName(e.target.value); }} placeholder="e.g. Mark" className="mt-1 w-full p-3 border border-gray-300 rounded-xl text-sm" /></label>}
      <label className="block mb-3"><span className="text-sm font-medium text-gray-700">Email</span><input type="email" value={email} onChange={function(e) { setEmail(e.target.value); }} placeholder="you@example.com" className="mt-1 w-full p-3 border border-gray-300 rounded-xl text-sm" autoComplete="email" /></label>
      {mode !== "reset" && <label className="block mb-4"><span className="text-sm font-medium text-gray-700">Password</span><input type="password" value={password} onChange={function(e) { setPassword(e.target.value); }} placeholder={mode === "signup" ? "Min 6 characters" : "Your password"} className="mt-1 w-full p-3 border border-gray-300 rounded-xl text-sm" autoComplete={mode === "signup" ? "new-password" : "current-password"} /></label>}
      {error && <div className="text-sm text-red-600 bg-red-50 p-3 rounded-xl mb-3">{error}</div>}
      {success && <div className="text-sm text-green-600 bg-green-50 p-3 rounded-xl mb-3">{success}</div>}
      <button onClick={handleSubmit} disabled={loading || !email} className="w-full py-3 bg-gradient-to-r from-indigo-600 to-blue-500 text-white rounded-xl font-bold disabled:opacity-50 flex items-center justify-center gap-2">{loading ? <><span className="animate-spin inline-block w-4 h-4 border-2 border-white border-t-transparent rounded-full" />Please wait...</> : mode === "login" ? "Log In" : mode === "signup" ? "Create Account" : "Send Reset Email"}</button>
      {mode === "login" && <button onClick={function() { setMode("reset"); setError(""); setSuccess(""); }} className="w-full text-center text-sm text-indigo-600 mt-3">Forgot password?</button>}
      {mode === "reset" && <button onClick={function() { setMode("login"); setError(""); setSuccess(""); }} className="w-full text-center text-sm text-indigo-600 mt-3">← Back to login</button>}
    </div></div>
  </div>);
}

function AuthGate() {
  var [session, setSession] = useState(null);
  var [checking, setChecking] = useState(true);
  useEffect(function() {
    sb.auth.getSession().then(function(result) { var s = result.data.session; if (s) { CURRENT_UID = s.user.id; ANTHROPIC_API_KEY = localStorage.getItem("pd_api_key") || ""; } setSession(s); setChecking(false); });
    var { data: { subscription } } = sb.auth.onAuthStateChange(function(event, s) { if (s) { CURRENT_UID = s.user.id; ANTHROPIC_API_KEY = localStorage.getItem("pd_api_key") || ""; } else { CURRENT_UID = null; } setSession(s); });
    return function() { subscription.unsubscribe(); };
  }, []);
  if (checking) return (<div className="max-w-md mx-auto min-h-screen bg-gray-50 flex items-center justify-center"><div className="text-center"><div className="animate-spin w-8 h-8 border-4 border-blue-600 border-t-transparent rounded-full mx-auto mb-3" /><p className="text-gray-500">Loading...</p></div></div>);
  if (!session) return <AuthScreen />;
  return <App />;
}

ReactDOM.render(<AuthGate />, document.getElementById("root"));

</script>
</body>
</html>
